<style>
html,body{margin:0;background:#000;color:#F5F0E8;font-family:'Schibsted Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#F5F0E8;text-decoration:none}
a:hover{color:#C4567A}
button,input,textarea,select{font:inherit;color:inherit}
::selection{background:#8B1A2E;color:#F5F0E8}
:focus-visible{outline:2px solid #C4567A;outline-offset:2px}
img{max-width:100%}
.ic{display:inline-block;vertical-align:-0.14em;flex:none}

/* hover states (were style-hover in the design file) */
.btn-cream{background:#F5F0E8;color:#0f0507;border:0;border-radius:999px;cursor:pointer;font-weight:600;transition:background .2s,color .2s}
.btn-cream:hover{background:#C4567A;color:#F5F0E8}
.btn-ghost{background:transparent;border:1px solid rgba(245,240,232,0.28);border-radius:999px;cursor:pointer;font-weight:600;color:#F5F0E8;transition:background .2s}
.btn-ghost:hover{background:rgba(245,240,232,0.08);color:#F5F0E8}
.link-btn{background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:#F5F0E8}
.link-btn:hover{color:#C4567A}
.muted-link{color:#8A7A80}
.muted-link:hover{color:#F5F0E8}
.nav-btn{border:0;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;transition:background .2s,color .2s}
.nav-btn:hover{color:#F5F0E8 !important;background:rgba(245,240,232,0.08) !important}
.card{background:none;border:0;padding:0;cursor:pointer;text-align:left;display:grid;gap:14px;color:#F5F0E8}
.card:hover{color:#F5F0E8}
.card img{transition:transform .5s ease}
.card:hover img{transform:scale(1.04)}
.svc-card{transition:border-color .2s}
.svc-card:hover{border-color:rgba(196,86,122,0.5) !important}
.dock-btn{transition:transform .15s}
.dock-btn:hover{transform:translateY(-5px) scale(1.08);color:#F5F0E8}
.tile:hover{background:rgba(245,240,232,0.16) !important;color:#FFFFFF}
.next-btn:hover{background:#A3264A !important;color:#F5F0E8}
.field{font-size:16px;color:#F5F0E8;padding:13px 14px;background:#000;border:1px solid rgba(245,240,232,0.16);border-radius:12px;outline:none}
.field:focus{border-color:#C4567A}
.pill-btn{border:1px solid rgba(245,240,232,0.18);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500}
.stamp{cursor:zoom-in;transition:transform .2s}
.stamp:hover{transform:translateY(-3px)}
.zoomable{cursor:zoom-in}

/* stickers hide on small screens (was the `narrow` check) */
@media (max-width:759px){.sticker{display:none !important}}
@media (max-width:600px){.hdr-hire{display:none !important}}

/* gallery: natural image heights */
.gallery{columns:3 220px;column-gap:16px}
.gallery>*{break-inside:avoid;margin-bottom:16px}

/* lightbox */
#lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;padding:clamp(12px,4vw,48px)}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,0.6)}
#lightbox.tall{align-items:flex-start;overflow-y:auto;padding-top:72px}
#lightbox.tall img{max-height:none;width:min(600px,100%);height:auto}
.lb-btn{position:fixed;width:48px;height:48px;border-radius:50%;border:1px solid rgba(245,240,232,0.25);background:rgba(245,240,232,0.1);color:#F5F0E8;font-size:20px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lb-btn:hover{background:rgba(245,240,232,0.2)}
.lb-close{top:16px;right:16px}
.lb-prev{left:16px;top:50%;transform:translateY(-50%)}
.lb-next{right:16px;top:50%;transform:translateY(-50%)}
.lb-count{background:rgba(0,0,0,0.7);padding:4px 10px;border-radius:999px;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:12px;color:#B8AAA0}

(function () {

    {

    {

    {

      <div style="aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:#3a2a22"><img src="assets/lalu-portrait.jpg" alt="Luisa Fe Meneses" style="width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block"></div>
      <div class="sticker" style="position:absolute;right:-20px;bottom:32px;transform:rotate(-4deg);background:#EFE4D3;color:#1a0a0e;padding:10px 14px;border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.5;box-shadow:0 14px 30px rgba(0,0,0,0.5);border-left:2px dashed #B9A68F;white-space:nowrap"><div style="font-weight:500">ADMIT ONE ONLY</div><div style="color:#6b5647;text-transform:uppercase">Luisa Fe Meneses — Lalu</div></div>
    </div>
    <div style="display:grid;gap:20px">
      ${eyebrow('About me')}
      <h1 style="margin:0;font-size:clamp(32px,3.8vw,48px);line-height:1.08;letter-spacing:-0.035em;font-weight:700">The designer behind <span style="font-family:'Newsreader',serif;font-style:italic;font-weight:400;color:#C4567A;letter-spacing:-0.02em">the work.</span></h1>
      <div style="display:grid;gap:16px;font-size:16px;line-height:1.75;color:#CFC4BA;max-width:38em">
        <p style="margin:0">Hi, I'm <strong style="color:#F5F0E8;font-weight:600">Lalu</strong>.</p>
        <p style="margin:0">I'm a graphic designer working with brands and organizations that stand for something. I build brand identities, campaigns, and editorial layouts that are as strategic as they are meaningful, because purpose still has to perform.</p>
        <p style="margin:0">My style doesn't have a fixed address. It moves to wherever the message needs it to be.</p>
        <p style="margin:0">I design work that makes you feel something before you've read a word.</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:4px">
        <a href="#/contact" class="btn-cream" style="padding:14px 24px;font-size:15px">Hire me <svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <a href="assets/cv/Luisa-Fe-Meneses-CV.pdf" target="_blank" rel="noopener" download class="btn-ghost" style="display:inline-flex;align-items:center;gap:8px;padding:14px 24px;font-size:15px"><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg> Download CV</a>
      </div>
    </div>
  </section>

  <section style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,40px) clamp(48px,6vw,80px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px">
    <div style="padding:clamp(24px,3vw,36px);border-radius:22px;background:#0E0E0E;border:1px solid rgba(245,240,232,0.08);display:grid;gap:20px;align-content:start">
      <h2 style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em">Tools</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px">
        ${tools.map(t => `<div style="display:grid;justify-items:center;gap:8px;padding:16px 8px;border-radius:16px;background:rgba(245,240,232,0.04);border:1px solid rgba(245,240,232,0.08)"><span style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:${t[2]};font-size:15px;font-weight:700">${t[0]}</span><span style="font-size:13px;color:#D8CCC2;text-align:center">${t[1]}</span></div>`).join('')}
      </div>
    </div>
    <div style="padding:clamp(24px,3vw,36px);border-radius:22px;background:#0E0E0E;border:1px solid rgba(245,240,232,0.08);display:grid;gap:20px;align-content:start">
      <h2 style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em">Skills</h2>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${skills.map(k => `<span style="padding:8px 14px;border-radius:999px;background:rgba(245,240,232,0.06);border:1px solid rgba(245,240,232,0.1);font-size:14px">${k}</span>`).join('')}</div>
    </div>
  </section>

  <section style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,40px) clamp(48px,6vw,80px)">
    <div style="position:relative;border-radius:24px;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;background:#000">
      <img src="assets/cv-banner.png" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%">
      <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.92) 10%,rgba(0,0,0,0.35) 60%,rgba(0,0,0,0.1))"></div>
      <div style="position:relative;width:100%;padding:clamp(24px,3vw,40px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px">
        <div style="display:grid;gap:10px;max-width:520px">
          <h2 style="margin:0;font-size:clamp(26px,2.8vw,36px);font-weight:700;letter-spacing:-0.03em">View my <span style="font-family:'Newsreader',serif;font-style:italic;font-weight:400;color:#E7B3C3">CV.</span></h2>
          <p style="margin:0;font-size:15px;line-height:1.6;color:#D8CCC2">A full overview of my education, skills, and design experience. Available for download — or reach out directly and let’s talk about your next project.</p>
        </div>
        <a href="assets/cv/Luisa-Fe-Meneses-CV.pdf" target="_blank" rel="noopener" download class="btn-cream" style="padding:14px 24px;font-size:15px"><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg> Download CV</a>
      </div>
    </div>
  </section>
</div>`;
  }

  function contact() {
    const opt = (list, cur, key) => list.map(t => `<button type="button" class="pill-btn" data-opt="${key}" data-val="${t}" aria-pressed="${cur === t}" style="background:${cur === t ? cream : 'transparent'};color:${cur === t ? ink : cream}">${t}</button>`).join('');
    return `
<div data-screen-label="Contact" style="max-width:1200px;margin:0 auto;padding:clamp(48px,6vw,88px) clamp(16px,4vw,40px) clamp(64px,8vw,112px)">
  <div style="display:grid;gap:14px;max-width:640px;margin-bottom:40px">
    ${eyebrow('Contact')}
    <h1 style="margin:0;font-size:clamp(34px,4vw,52px);line-height:1.05;letter-spacing:-0.035em;font-weight:700">Let's work <span style="font-family:'Newsreader',serif;font-style:italic;font-weight:400;color:#C4567A;letter-spacing:-0.02em">together.</span></h1>
    <p style="margin:0;font-size:17px;line-height:1.6;color:#B8AAA0">Tell me about your brand, campaign or publication. I'm open for freelance work.</p>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:20px;align-items:start">
    <div style="padding:clamp(24px,3vw,36px);border-radius:24px;background:#0E0E0E;border:1px solid rgba(245,240,232,0.08)">
      <form id="contact-form" style="display:grid;gap:18px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px">
          <label style="display:grid;gap:8px;font-size:13px;font-weight:500;color:#B8AAA0">Name<input name="name" required class="field" autocomplete="name"></label>
          <label style="display:grid;gap:8px;font-size:13px;font-weight:500;color:#B8AAA0">Email<input name="email" type="email" required class="field" autocomplete="email"></label>
        </div>
        <label style="display:grid;gap:8px;font-size:13px;font-weight:500;color:#B8AAA0">Brand or organization<input name="org" class="field" autocomplete="organization"></label>
        <div style="display:grid;gap:8px"><span style="font-size:13px;font-weight:500;color:#B8AAA0">What do you need?</span>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${opt(projectTypes, state.ptype, 'ptype')}</div>
        </div>
        <div style="display:grid;gap:8px"><span style="font-size:13px;font-weight:500;color:#B8AAA0">Timeline</span>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${opt(timelines, state.timeline, 'timeline')}</div>
        </div>
        <label style="display:grid;gap:8px;font-size:13px;font-weight:500;color:#B8AAA0">Project details<textarea name="details" rows="5" class="field" style="resize:vertical"></textarea></label>
        <div><button type="submit" class="btn-cream" style="padding:14px 26px;font-size:15px">Send inquiry <svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
      </form>
    </div>
    <div style="display:grid;gap:12px">
      ${contactRow.map(c => `
        <div style="padding:18px 20px;border-radius:16px;background:#0E0E0E;border:1px solid rgba(245,240,232,0.08);display:grid;gap:4px">
          <span style="font-size:12px;color:#8A7A80">${c.k}</span>
          ${c.href ? `<a href="${c.href}" target="_blank" rel="noopener" style="font-size:17px;font-weight:600;overflow-wrap:anywhere">${c.v} <svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></a>` : `<span style="font-size:17px;font-weight:600">${c.v}</span>`}
        </div>`).join('')}
    </div>
  </div>
</div>`;
  }

  // ---------- ROUTER ----------
  const app = document.getElementById('app');
  const nav = document.getElementById('nav');
  const PAGES = { '': ['home', home, 'Lalu — Graphic Designer'], work: ['work', work, 'Work — Lalu'], services: ['services', servicesPage, 'Services — Lalu'], about: ['about', about, 'About — Lalu'], contact: ['contact', contact, 'Contact — Lalu'] };
  let current = { page: 'home', slug: null };

  function renderNav() {
    const active = current.page === 'project' ? 'work' : current.page;
    nav.innerHTML = [['Work', 'work'], ['Services', 'services'], ['About', 'about'], ['Contact', 'contact']].map(([label, p]) =>
      `<a href="#/${p}" class="nav-btn" ${active === p ? 'aria-current="page"' : ''} style="background:${active === p ? 'rgba(245,240,232,0.1)' : 'transparent'};color:${active === p ? cream : muted}">${label}</a>`).join('') +
      `<a href="#/contact" class="btn-cream hdr-hire" style="margin-left:6px;padding:9px 18px;font-size:14px">Hire me</a>`;
  }

  function render(scroll) {
    const parts = location.hash.replace(/^#\/?/, '').split('/');
    if (parts[0] === 'project' && parts[1]) {
      current = { page: 'project', slug: parts[1] };
      const p = projects.find(x => x.slug === parts[1]) || projects[0];
      app.innerHTML = project(p.slug);
      document.title = p.title + ' — Lalu';
    } else {
      const def = PAGES[parts[0]] || PAGES[''];
      current = { page: def[0], slug: null };
      app.innerHTML = def[1]();
      document.title = def[2];
    }
    renderNav();
    if (scroll) window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', () => { if (location.hash !== '#top') render(true); });
  document.getElementById('to-top').addEventListener('click', e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

  // clicks inside the page (filters, option pills, lightbox)
  app.addEventListener('click', e => {
    const f = e.target.closest('[data-filter]');
    if (f) { state.filter = f.dataset.filter; app.innerHTML = work(); return; }
    const o = e.target.closest('[data-opt]');
    if (o) {
      state[o.dataset.opt] = o.dataset.val;
      o.parentElement.querySelectorAll('[data-opt]').forEach(b => {
        const on = b === o;
        b.style.background = on ? cream : 'transparent'; b.style.color = on ? ink : cream; b.setAttribute('aria-pressed', on);
      });
      return;
    }
    const z = e.target.closest('[data-lb]');
    if (z) openLightbox(+z.dataset.lb);
  });

  // contact form -> opens the visitor's email app with the message filled in
  app.addEventListener('submit', e => {
    if (e.target.id !== 'contact-form') return;
    e.preventDefault();
    const d = new FormData(e.target);
    const subject = 'Project inquiry — ' + state.ptype + (d.get('org') ? ' (' + d.get('org') + ')' : '');
    const body = [
      'Name: ' + d.get('name'),
      'Email: ' + d.get('email'),
      'Brand or organization: ' + (d.get('org') || '—'),
      'What I need: ' + state.ptype,
      'Timeline: ' + state.timeline,
      '',
      d.get('details') || ''
    ].join('\n');
    location.href = 'mailto:menesesluisafe@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  });

  // ---------- LIGHTBOX ----------
  const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img'), lbCount = document.getElementById('lb-count');
  let lbList = [], lbIdx = 0;
  function showLb() { lbImg.src = lbList[lbIdx]; lbCount.textContent = (lbIdx + 1) + ' / ' + lbList.length; }
  function openLightbox(i) {
    const p = projects.find(x => x.slug === current.slug);
    if (!p || !p.gallery.length) return;
    lbList = p.gallery; lbIdx = i; showLb();
    lb.classList.toggle('tall', !!p.tall); lb.scrollTop = 0;
    lb.classList.add('open'); document.body.style.overflow = 'hidden';
    document.getElementById('lb-close').focus();
  }
  function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  const step = d => { lbIdx = (lbIdx + d + lbList.length) % lbList.length; showLb(); };
  document.getElementById('lb-close').onclick = closeLb;
  document.getElementById('lb-prev').onclick = e => { e.stopPropagation(); step(-1); };
  document.getElementById('lb-next').onclick = e => { e.stopPropagation(); step(1); };
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  render(false);
})();
</script>
</body>
</html>
